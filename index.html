<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asistent obce Radim</title>

<style>
:root{
  --text:#0f172a;
  --brand:#1e3a8a;
  --brand2:#1d4ed8;
  --shadow: 0 24px 70px rgba(2,6,23,.28);
  --meBg: rgba(219,234,254,.92);
  --botBg: rgba(255,255,255,.88);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:#0b1220;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
[hidden]{ display:none !important; }

/* ===== BACKGROUND ===== */
.bg{
  position:fixed; inset:0; z-index:0;
  background:#0b1220;
}
.bgImg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:top center;
  opacity:.92;
}
.bgVignette{
  position:absolute; inset:0;
  background: radial-gradient(1200px 900px at 30% 15%, transparent 42%, rgba(0,0,0,.58) 100%);
}

/* ===== CHAT ===== */
.chat-widget{
  position:fixed;
  right:20px;
  bottom:20px;
  width:392px;
  height:640px;
  background: rgba(255,255,255,.10);
  border-radius:22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:9999;
}

.chat-header{
  padding:12px;
  background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.brandmark{
  width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
}
.brandmark img{width:100%;height:100%;object-fit:contain;padding:6px}

.chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  max-width:86%;
  padding:10px 12px;
  border-radius:16px;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}
.me{align-self:flex-end;background:var(--meBg)}
.bot{align-self:flex-start;background:var(--botBg)}
.msg a{color:#1d4ed8;text-decoration:none}
.msg a:hover{text-decoration:underline}

.quickbar{
  padding:8px 12px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.qb{
  border:0;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  background:rgba(29,78,216,.25);
  color:#fff;
  cursor:pointer;
}

.loading-bar{
  display:flex;
  gap:8px;
  padding:10px 12px;
  font-size:13px;
  color:#fff;
}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:#fff;
  display:inline-block;
  animation:bounce 1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{opacity:.3}}

.row{
  display:flex;
  gap:8px;
  padding:10px 12px;
}
input{
  flex:1;
  height:42px;
  border-radius:999px;
  border:0;
  padding:0 14px;
}
button.send{
  width:44px;
  border-radius:12px;
  border:0;
  background:#1d4ed8;
  color:#fff;
  font-weight:900;
}

.radim-fab{
  position:fixed;
  right:20px;
  bottom:20px;
  padding:10px 14px;
  border-radius:999px;
  background:#0b1220;
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  cursor:pointer;
  z-index:10000;
}
</style>
</head>

<body>

<div class="bg">
  <div class="bgImg" id="bgImg"></div>
  <div class="bgVignette"></div>
</div>

<div id="widget" class="chat-widget">
  <div class="chat-header" onclick="closeChat()">
    <div class="brandmark"><img src="/skins/radim/erb.png" alt=""></div>
    <strong>Asistent obce Radim</strong>
  </div>

  <div id="chat" class="chat"></div>

  <div class="quickbar">
    <button class="qb" onclick="ask('Jaké jsou úřední hodiny?')">Úřední hodiny</button>
    <button class="qb" onclick="ask('Poplatky za odpady')">Odpady</button>
    <button class="qb" onclick="ask('Kontakt na obecní úřad')">Kontakty</button>
  </div>

  <div id="loadingBar" class="loading-bar" hidden>
    <div class="typing"><span></span><span></span><span></span></div>
    <span>Generuje se odpověď…</span>
  </div>

  <div class="row">
    <input id="q" placeholder="Napište dotaz…" />
    <button class="send" onclick="ask()">➤</button>
  </div>
</div>

<button id="fab" class="radim-fab" onclick="openChat()">Poradíme vám</button>

<script>
const chatEl = document.getElementById("chat");
const input = document.getElementById("q");
const widget = document.getElementById("widget");
const fab = document.getElementById("fab");
const loadingBar = document.getElementById("loadingBar");

function openChat(){ widget.style.display="flex"; fab.style.display="none"; input.focus(); }
function closeChat(){ widget.style.display="none"; fab.style.display="block"; }

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
}

function stripCitations(t){
  return String(t??"")
    .replace(/【[^】]*】/g,"")
    .replace(/\[[^\]]*\d+:\d+†[^\]]*\]/g,"")
    .replace(/(^|\s)\d+:\d+(\s|$)/g," ")
    .replace(/\s{2,}/g," ")
    .trim();
}

function linkify(text){
  return escapeHtml(text).replace(/https?:\/\/[^\s]+/g,u=>{
    const clean=u.replace(/[),.;]+$/g,"");
    return `<a href="${clean}" target="_blank">${clean}</a>`;
  });
}

function add(who,text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerHTML=`<strong>${who}:</strong> ${linkify(stripCitations(text))}`;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

async function ask(q){
  const msg=q||input.value.trim();
  if(!msg) return;
  add("Vy",msg,"me");
  input.value="";
  loadingBar.hidden=false;

  try{
    const r=await fetch("/.netlify/functions/search",{
      method:"POST",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ message:msg })
    });
    const j=await r.json();
    add("Radim",j.answer||"Bez odpovědi","bot");
  }catch{
    add("Radim","Chyba spojení.","bot");
  }finally{
    loadingBar.hidden=true;
  }
}

add("Radim","Ahoj 👋 Jsem oficiální asistent obce Radim. Zeptej se mě na cokoliv ohledně obce.","bot");
</script>

</body>
</html>
