<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asistent obce Radim</title>

<style>
:root{
  --text:#0f172a;
  --brand:#1e3a8a;
  --brand2:#1d4ed8;
  --shadow: 0 24px 70px rgba(2,6,23,.28);
  --meBg: rgba(219,234,254,.92);
  --botBg: rgba(255,255,255,.88);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:#0b1220;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
[hidden]{ display:none !important; }

/* ====== BACKGROUND ====== */
.bg{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(1200px 700px at 25% 0%, rgba(29,78,216,.22), transparent 60%),
    radial-gradient(900px 600px at 85% 15%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)),
    #0b1220;
}
.bgImg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:top center;
  filter:saturate(1.02) contrast(1.02);
  opacity:.92;
  transform:scale(1.02);
}
.bg::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(90deg, rgba(11,18,32,.78), rgba(11,18,32,.42));
  pointer-events:none;
}
.bgVignette{
  position:absolute; inset:0;
  background: radial-gradient(1200px 900px at 30% 15%, transparent 42%, rgba(0,0,0,.58) 100%);
  pointer-events:none;
}

/* ====== CHAT WIDGET ====== */
.chat-widget{
  position:fixed;
  right:20px;
  bottom:20px;
  width:392px;
  height:640px;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:9999;
}

/* HEADER */
.chat-header{
  padding:12px 12px 10px;
  background: linear-gradient(135deg, rgba(30,58,138,.92), rgba(21,48,111,.88));
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.brandmark{
  width:44px;height:44px;border-radius:16px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
}
.brandmark img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.header-title{font-weight:950;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chip{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14)}

.hdr-close{
  width:34px;height:34px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.14);
  color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  line-height:1;
  user-select:none;
}
.hdr-close:hover{ background: rgba(255,255,255,.22); }

/* klikatelné zavření i na levé části headeru (mimo tlačítka) */
.header-clickzone{
  cursor:pointer;
  display:flex; align-items:center; gap:10px;
  min-width:0;
}

/* CHAT AREA */
.chat{
  flex:1;
  padding:14px 12px 10px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  background: transparent;
}

/* Messages */
.msg{
  max-width:86%;
  padding:10px 12px;
  border-radius:16px;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 28px rgba(0,0,0,.16);
}
.me{align-self:flex-end;background:var(--meBg);border-bottom-right-radius:8px}
.bot{align-self:flex-start;background:var(--botBg);border-bottom-left-radius:8px}
.msg strong{font-weight:950}
.msg a{color:var(--brand2);word-break:break-word;text-decoration:none}
.msg a:hover{text-decoration:underline}

/* ===== Quick buttons (jen 3) ===== */
.quickbar{
  margin:8px 12px 10px 12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.quickbar .qb{
  border:0;
  cursor:pointer;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  color: rgba(255,255,255,.92);
  background: rgba(29,78,216,.30);
  box-shadow: 0 10px 24px rgba(0,0,0,.18);
}
.quickbar .qb:hover{ background: rgba(29,78,216,.40); }

/* ===== FEEDBACK (výraznější) ===== */
.feedback{
  margin:6px 12px 10px 12px;
  padding:10px 12px;
  border-radius:16px;
  background: linear-gradient(135deg, rgba(29,78,216,.32), rgba(0,0,0,.22));
  border:1px solid rgba(255,255,255,.18);
  color: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
}
.feedback .q{font-weight:950;font-size:12px;margin-bottom:8px}
.feedback .row{
  display:flex;
  gap:8px;
  padding:0;
  border:0;
  background: transparent;
  backdrop-filter:none;
}
.fbBtn{
  flex:1;
  border:1px solid rgba(255,255,255,.20);
  background: rgba(29,78,216,.34);
  color: rgba(255,255,255,.95);
  border-radius:999px;
  height:34px;
  cursor:pointer;
  font-weight:950;
  font-size:12px;
}
.fbBtn:hover{ background: rgba(29,78,216,.44); }

/* ===== LOADING BAR ===== */
.loading-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  margin:0 12px 8px 12px;
  border-radius:14px;
  background: rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.14);
  font-size:13px;
  color: rgba(255,255,255,.92);
  backdrop-filter: blur(10px);
}
.typing{display:inline-flex;gap:6px;align-items:center}
.typing span{
  width:7px;height:7px;border-radius:999px;
  background: rgba(255,255,255,.92);
  opacity:.35;
  animation:bounce 1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.12s}
.typing span:nth-child(3){animation-delay:.24s}
@keyframes bounce{
  0%,100%{transform:translateY(0);opacity:.35}
  50%{transform:translateY(-4px);opacity:1}
}

/* INPUT */
.row{
  display:flex;
  gap:10px;
  padding:10px 12px 12px;
  border-top:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
}
input{
  flex:1;
  height:44px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background: rgba(0,0,0,.28);
  color:#fff;
  font-size:16px;
  outline:none;
}
input::placeholder{color: rgba(255,255,255,.72)}
button.send{
  width:48px;
  height:44px;
  border:0;
  border-radius:14px;
  background: linear-gradient(135deg, rgba(29,78,216,.95), rgba(0,229,255,.25));
  color:#fff;
  font-weight:950;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow: 0 14px 28px rgba(0,0,0,.25);
}
button.send:disabled{opacity:.55;cursor:not-allowed}

/* FLOATING TAB (slabší blink, bez “šíleného” scale) */
.radim-fab{
  position:fixed;
  right:20px;
  bottom:20px;
  height:60px;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.28);
  cursor:pointer;
  background: rgba(10,16,28,.80);
  backdrop-filter: blur(12px);
  box-shadow: 0 28px 96px rgba(0,0,0,.66);
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:10000;
  transform: translateZ(0);
}
.radim-fab.blink{
  animation: fabPulse 2.2s ease-in-out infinite;
}
@keyframes fabPulse{
  0%,100%{
    box-shadow: 0 28px 96px rgba(0,0,0,.66);
    border-color: rgba(255,255,255,.28);
    filter: none;
  }
  50%{
    box-shadow:
      0 34px 120px rgba(29,78,216,.24),
      0 28px 96px rgba(0,0,0,.66);
    border-color: rgba(0,229,255,.40);
    filter: saturate(1.03);
  }
}

.fabIcon{
  width:40px;height:40px;border-radius:16px;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
}
.fabIcon img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.fabText{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.fabText .a{font-weight:950;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.fabText .b{font-size:11px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}

/* Onboarding “šipka + rámeček” nad lištou */
.coach{
  position:fixed;
  right:20px;
  bottom:92px;
  z-index:10001;
  width:260px;
  max-width:calc(100vw - 40px);
  border-radius:16px;
  background: rgba(10,16,28,.86);
  border:1px solid rgba(255,255,255,.18);
  box-shadow: 0 18px 60px rgba(0,0,0,.50);
  backdrop-filter: blur(12px);
  color:#fff;
  padding:10px 12px;
}
.coach:after{
  content:"";
  position:absolute;
  right:34px;
  bottom:-10px;
  width:0;height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:10px solid rgba(10,16,28,.86);
  filter: drop-shadow(0 -1px 0 rgba(255,255,255,.12));
}
.coach .top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.coach .title{
  font-weight:950;
  font-size:12px;
  color:rgba(255,255,255,.95);
}
.coach .desc{
  margin-top:4px;
  font-size:11px;
  color:rgba(255,255,255,.78);
  line-height:1.25;
}
.coach .x{
  width:28px;height:28px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.10);
  color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
  user-select:none;
}
.coach .x:hover{ background: rgba(255,255,255,.16); }

/* Mobile */
@media(max-width:480px){
  .chat-widget{right:12px;left:12px;bottom:12px;width:auto;height:80vh}
  .radim-fab{right:12px;bottom:12px}
  .coach{right:12px;bottom:84px;width:240px}
  .coach:after{ right:28px; }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce){
  .typing span{animation:none}
  .radim-fab.blink{animation:none}
}
</style>
</head>

<body>
<div class="bg" aria-hidden="true">
  <div class="bgImg" id="bgImg"></div>
  <div class="bgVignette"></div>
</div>

<!-- Onboarding box -->
<div id="coach" class="coach" hidden>
  <div class="top">
    <div>
      <div class="title">Asistent obce Radim</div>
      <div class="desc">Klikněte sem a zeptejte se.</div>
    </div>
    <button id="coachClose" class="x" type="button" aria-label="Zavřít">✕</button>
  </div>
</div>

<!-- CHAT -->
<div id="widget" class="chat-widget" role="dialog" aria-label="Chat – Asistent obce Radim">
  <div class="chat-header">
    <div class="header-clickzone" id="headerClick" title="Zavřít chat">
      <div class="brandmark" id="brandmark"><span id="brandFallback" style="font-size:16px;font-weight:900;">AI</span></div>
      <div style="min-width:0;">
        <div class="header-title">Asistent obce Radim</div>
      </div>
    </div>

    <div class="header-right">
      <div class="chip">Online</div>
      <button class="hdr-close" id="closeBtn" type="button" aria-label="Zavřít">✕</button>
    </div>
  </div>

  <div id="chat" class="chat"></div>

  <!-- Quick buttons (jen 3, krátké dotazy) -->
  <div class="quickbar" id="quickbar">
    <button class="qb" type="button" data-q="Kontakty úřadu.">Kontakty úřadu</button>
    <button class="qb" type="button" data-q="Úřední hodiny úřadu.">Úřední hodiny</button>
    <button class="qb" type="button" data-q="Kde je skládka bioodpadu v Radimi?">Bioodpad</button>
  </div>

  <!-- Loading -->
  <div id="loadingBar" class="loading-bar" hidden>
    <span class="typing" aria-label="Generuje se odpověď">
      <span></span><span></span><span></span>
    </span>
    <span>Generuje se odpověď…</span>
  </div>

  <!-- Feedback mount -->
  <div id="feedbackMount"></div>

  <div class="row">
    <input id="q" type="text" placeholder="Napište dotaz…" />
    <button id="send" class="send" aria-label="Odeslat">➤</button>
  </div>
</div>

<!-- Floating tab -->
<button id="fab" class="radim-fab blink" type="button" aria-label="Otevřít chat">
  <div class="fabIcon" id="fabIcon"><span id="fabFallback" style="font-size:12px;font-weight:900;">AI</span></div>
  <div class="fabText">
    <div class="a">Poradíme vám</div>
    <div class="b">Klikněte a napište dotaz…</div>
  </div>
</button>

<script>
const chatEl=document.getElementById("chat");
const input=document.getElementById("q");
const send=document.getElementById("send");
const widget=document.getElementById("widget");
const fab=document.getElementById("fab");

const loadingBar=document.getElementById("loadingBar");
const bgImg = document.getElementById("bgImg");
const brandmark = document.getElementById("brandmark");
const brandFallback = document.getElementById("brandFallback");
const fabIcon = document.getElementById("fabIcon");
const fabFallback = document.getElementById("fabFallback");
const quickbar = document.getElementById("quickbar");

const headerClick = document.getElementById("headerClick");
const closeBtn = document.getElementById("closeBtn");
const feedbackMount = document.getElementById("feedbackMount");

const coach = document.getElementById("coach");
const coachClose = document.getElementById("coachClose");

// --- Assets
const BG_URL = "/skins/radim/bg.jpg";
const ERB_URL = "/skins/radim/erb.png";

// ✅ Thread persistence key (Variant A)
const THREAD_KEY = "radim_thread_id_v1";

// onboarding
const COACH_KEY = "radim_coach_dismissed_v1";
function showCoach(){
  if(!coach) return;
  if(localStorage.getItem(COACH_KEY)==="1") return;
  // jen když je chat zavřený
  if(widget.style.display === "flex") return;
  coach.hidden = false;
}
function hideCoach(save){
  if(!coach) return;
  coach.hidden = true;
  if(save) localStorage.setItem(COACH_KEY,"1");
}
coachClose?.addEventListener("click",(e)=>{ e.preventDefault(); hideCoach(true); });

function setFabBlink(on){
  fab.classList.toggle("blink", !!on);
}

function openChat(){
  widget.style.display="flex";
  fab.style.display="none";
  setFabBlink(false);
  hideCoach(false);
  setTimeout(()=>input.focus(),100);
}
function closeChat(){
  widget.style.display="none";
  fab.style.display="flex";
  setFabBlink(true);
  showCoach();
}

// header close handlers
headerClick.addEventListener("click", (e)=>{ e.preventDefault(); closeChat(); });
closeBtn.addEventListener("click", (e)=>{ e.preventDefault(); closeChat(); });

// open button
fab.addEventListener("click", (e)=>{ e.preventDefault(); openChat(); });

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
}

/* ✅ RESET: skutečně resetne thread + UI */
function doHardReset(){
  try { localStorage.removeItem(THREAD_KEY); } catch {}
  // vyčisti chat UI
  chatEl.innerHTML = "";
  // reset feedback počítadel
  userQuestionsCount = 0;
  feedbackShown = false;
  removeFeedback();

  // úvodní zprávy znovu
  addMessage(
    "Radim",
    "Upozornění:\nOdpovědi tohoto asistenta jsou generovány umělou inteligencí na základě dostupných informací.\nPrávně závazné a oficiální informace si vždy ověřte na oficiálním webu obce Radim nebo přímo na obecním úřadě.",
    "bot"
  );
  addMessage("Radim","Konverzace byla resetována. Zeptejte se prosím znovu.","bot");
}

/* ---- ČIŠTĚNÍ ODPOVĚDI: JEN bezpečné věci (bez agresivního mazání řádků) ---- */
function cleanAnswerText(input){
  if(!input) return "";
  let t = String(input);

  // File Search citace: 【...†...】
  t = t.replace(/【[^】]*†[^】]*】/g, "");

  // markdown tučné **text**
  t = t.replace(/\*\*(.*?)\*\*/g, "$1");

  // velmi mírné odstranění “meta” vět (jen pokud jsou to evidentně technické věty)
  // — nepoužívat agresivní regex, který může sežrat normální odpověď
  const badLines = [
    /použív(á|a)m vyhledávací nástroj/i,
    /pracuji na principu vyhledávání/i,
    /odpovídám výhradně na základě dokumentu/i,
    /99[_ ]?FULL_obec_radim\.txt/i,
    /vector\s*store/i,
    /file[_\s-]?search/i,
    /\bOpenAI\b/i
  ];
  t = t
    .split("\n")
    .filter(line => !badLines.some(re => re.test(line.trim())))
    .join("\n");

  // zbytečné mezery / prázdné řádky
  t = t.replace(/[ \t]+\n/g, "\n");
  t = t.replace(/\n{3,}/g, "\n\n");

  return t.trim();
}

/* linkify */
function linkify(t){
  const s=escapeHtml(t);
  return s.replace(/(https?:\/\/[^\s]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}

function addMessage(who,text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  const cleaned = cleanAnswerText(text || "");
  d.innerHTML=`<strong>${who}:</strong> ${linkify(cleaned)}`;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

function showLoading(on){
  loadingBar.hidden = !on;
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ===== FEEDBACK LOGIKA ===== */
let userQuestionsCount = 0;
let feedbackShown = false;

function removeFeedback(){
  feedbackMount.innerHTML = "";
}

function showFeedbackOnce(){
  if (feedbackShown) return;
  feedbackShown = true;

  const wrap = document.createElement("div");
  wrap.className = "feedback";
  wrap.innerHTML = `
    <div class="q">Dostali jste odpověď?</div>
    <div class="row">
      <button class="fbBtn" type="button" data-v="yes">Ano</button>
      <button class="fbBtn" type="button" data-v="no">Ne</button>
    </div>
  `;

  feedbackMount.appendChild(wrap);

  wrap.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-v]");
    if(!btn) return;
    const v = btn.getAttribute("data-v");

    removeFeedback();
    if(v === "yes"){
      addMessage("Radim","Super, to mě těší. Kdykoliv se zeptejte znovu.","bot");
    }else{
      addMessage("Radim","To mě mrzí. Zkuste prosím dotaz napsat jinak, nebo napište, co přesně hledáte.","bot");
    }
  });
}

function isResetCommand(q){
  const s = String(q || "").trim().toLowerCase();
  return s === "reset" || s === "/reset" || s === "restart" || s === "/restart" || s === "nový chat" || s === "novy chat";
}

async function ask(qOverride){
  const q=(qOverride ?? input.value).trim();
  if(!q) return;

  // ✅ local reset
  if (isResetCommand(q)) {
    addMessage("Vy", q, "me");
    input.value="";
    doHardReset();
    return;
  }

  addMessage("Vy",q,"me");
  input.value="";
  send.disabled=true;
  showLoading(true);

  try{
    // ✅ Variant A: always send thread_id + persist returned thread_id
    const thread_id = localStorage.getItem(THREAD_KEY) || null;

    const r=await fetch("/.netlify/functions/search",{
      method:"POST",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ message:q, thread_id })
    });

    const j=await r.json().catch(()=>({}));

    if (j && j.thread_id) {
      localStorage.setItem(THREAD_KEY, j.thread_id);
    }

    addMessage("Radim", (j && j.answer) ? j.answer : "Bez odpovědi", "bot");

    userQuestionsCount++;
    if(userQuestionsCount >= 2){
      showFeedbackOnce();
    }
  }catch(e){
    addMessage("Radim","Chyba spojení.","bot");
  }finally{
    showLoading(false);
    send.disabled=false;
  }
}

send.onclick=()=>ask();
input.addEventListener("keydown",e=>e.key==="Enter"&&ask());

// quickbar
quickbar.addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-q]");
  if(!btn) return;
  ask(btn.getAttribute("data-q"));
});

// Load background
(function loadBg(){
  const img = new Image();
  img.onload = () => { bgImg.style.backgroundImage = `url('${BG_URL}')`; };
  img.onerror = () => { bgImg.style.backgroundImage = ""; };
  img.src = BG_URL + "?v=" + Date.now();
})();

// Load erb into header + floating tab
(function loadErb(){
  const img = new Image();
  img.onload = () => {
    brandmark.innerHTML = "";
    const h = document.createElement("img");
    h.src = ERB_URL; h.alt = "Erb obce Radim";
    brandmark.appendChild(h);

    fabIcon.innerHTML = "";
    const f = document.createElement("img");
    f.src = ERB_URL; f.alt = "Erb obce Radim";
    fabIcon.appendChild(f);
  };
  img.onerror = () => {
    brandFallback.style.display = "inline";
    fabFallback.style.display = "inline";
  };
  img.src = ERB_URL + "?v=" + Date.now();
})();
